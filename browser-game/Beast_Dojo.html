:root {
 color-scheme:dark; font-family:"Avenir Next","Segoe UI",system-ui,sans-serif;

[hidden] {display:none!important}
html,body {margin:0;width:100%;height:100%;overflow:hidden;background:var(--ink);color:var(--paper)}
button,select {font:inherit;color:inherit;min-height:44px;font-weight:750;border:1px solid var(--line);border-radius:11px;background:var(--surface);padding:8px 12px}
button {cursor:pointer;touch-action:manipulation}

.primary {background:var(--gold);color:#202e24;border-color:#d39439;box-shadow:0 4px 0 #a56d30}

#game {height:100dvh;width:100%;position:relative;isolation:isolate;overflow:hidden}
#world,.vignette,#title-screen,#overlay {position:absolute;inset:0;width:100%;height:100%}

.xp-track {height:4px;background:#45675a;border-radius:9px;margin-top:3px;overflow:hidden}

.balances {display:flex;gap:6px;flex-wrap:wrap;justify-content:flex-end}

#desktop-keys {position:absolute;bottom:14px;left:50%;transform:translateX(-50%);font-size:12px;white-space:nowrap;padding:8px 12px;color:var(--soft);pointer-events:none}
#interact {position:absolute;bottom:64px;left:50%;transform:translateX(-50%);max-width:72vw}
#toast {position:absolute;left:50%;transform:translateX(-50%);top:79px;width:max-content;max-width:min(410px,80vw);border:1px solid #f2cf86;border-radius:12px;background:#23463d;padding:10px 15px;font-weight:800;text-align:center;pointer-events:none;z-index:3}

meter {width:100%;height:11px;accent-color:var(--jade)}

#overlay {display:grid;place-items:center;background:#102820b0;padding:14px;z-index:5}

.entry small {display:block;color:var(--soft);font-size:13px}
.entry.earned {border-color:#b4bf7c}
.entry button {margin-top:7px}
#queue-progress {display:block;width:100%;height:12px;accent-color:#ffc75c}

.panel-actions,.filters {display:flex;align-items:center;flex-wrap:wrap;gap:8px;margin:10px 0}
.fighter-card {display:grid;grid-template-columns:63px minmax(0,1fr);gap:9px}
.portrait {width:62px;height:62px;background:#183930;border-radius:8px}
.world-map {display:grid;grid-template-columns:repeat(3,1fr);gap:8px;margin:12px 0}

#title-screen {display:flex;align-items:center;z-index:4;pointer-events:none}
.title-wash {position:absolute;inset:0;background:linear-gradient(90deg,#112c26f2 2%,#183b30cc 27%,#193a2b26 63%,transparent 82%)}

.title-kicker {font-size:13px}

.edition {font-size:12px;color:var(--soft);letter-spacing:.07em}
.title-location {position:absolute;bottom:25px;right:25px;padding:10px 13px;font-size:13px;font-weight:850;letter-spacing:.08em}
.title-location small {display:block;color:var(--soft);letter-spacing:normal;margin-top:3px}

.game-link {color:#ffda83;display:inline-block;padding:10px 0}

  const row=Math.floor(id/6), col=id%6;

  function questUpdate(i) {

  function beginActivity(i,type) {

     [[0,0],[64,75],[190,62],[260,-44],[148,-116],[25,-96]],
     [[0,0],[52,-80],[136,-190],[244,-223],[261,-117],[232,10]],

   }

     const prev=p.routes[a.i];

   }

  }
  function timing() {

   } else {a.mistakes++;say('Try when the marker reaches the center');}

  function sequence(choice) {

    a.hits++;

   } else {a.hits=0;a.mistakes++;a.started=false;a.time=0;emit('activity',a);}

  function actor(id,x,y,team,health,scale=1) {

    cool:0,phase:'idle',wind:0,next:1,guard:0,inv:0,skill:0,charge:0,flash:0,scale};
  }
  function spawnRound(f) {
   const {mode,round,district,bossIndex}=f;
   const p=state.profile,id=p.active,x=f.x,y=f.y;
   f.hero=actor(id,x-103,y,'you',playerHealth(id));
   const count={duel:1,practice:1,spar:1,tag:2,brawl:7,raid:1,graduation:1}[mode];
   f.enemies=Array.from({length:count},(_,n)=>{

     mode==='raid'?500:mode==='graduation'?420:mode==='spar'?92:mode==='brawl'?95:botTiers[f.botTier]?.health??145,mode==='raid'||mode==='graduation'?1.7:1);

   });
   f.allies=mode==='raid'?[0,6,12].map((id,n)=>actor(id,x-115+n*90,y+115,'ally',110)):

  }
  function startFight(mode,i=state.region,bossIndex=0,botTier='') {

  const isOpponent = (a,b) => a!==b&&a.team!==b.team&&!(['you','ally'].includes(a.team)&&['you','ally'].includes(b.team));

  function damage(attacker,target,power,knockback) {

  function dash(input) {

  function returnFromFight(f){

   returnFromFight(f);

  function stepFight(dt,input) {
   const f=state.fight,h=f.hero,tier=botTiers[f.botTier];

   }

   for(const a of actors) {
    for(const k of ['cool','guard','guardCooldown','inv','skill','flash','swing'])a[k]=Math.max(0,(a[k]||0)-dt);

   }

  }
  function tick(dt,input={x:0,y:0}) {

   }
  }
  function objective() {

   return {title,detail,node:q===4?null:node};
  }
  return {state,tick,save,settle,travel,reset,equip,display,nearby,approach,enterRoom,exitRoom,talk,collect,beginActivity,

   }
   items.sort((p,q)=>p.y-q.y).forEach(i=>i.paint());
   if(!title&&!f&&!a){
    for(const d of districts)for(const n of d.nodes){
     if(!within(n.x,n.y)||n.kind==='seal'&&(state.profile.seals.includes(n.district+':'+n.seal)||distance(actor,n)>145))continue;

     const focus=state.objective?.node;
     marker(c,n,focus?.district===n.district&&focus.id===n.id,reduce?0:state.clock);

    if(state.target){
     oval(c,state.target.x,state.target.y,14,7,'#f7e0a3c9');

    }
    if(state.target?.kind==='spar'){
     let current=actor;

      current=next;
     }

   }
   if(!reduce)for(const fx of state.fx){

   }
   c.restore();
   const waypoint=a?.points?.[a.at]||(!f&&!title?state.target?.queue[0]||state.objective?.node:null);

     const dx=px-w/2,dy=py-h/2,edge=Math.min((w/2-31)/Math.max(1,Math.abs(dx)),(h/2-46)/Math.max(1,Math.abs(dy)));
     c.save();c.translate(w/2+dx*edge,h/2+dy*edge);c.rotate(Math.atan2(dy,dx));
     oval(c,0,0,17,17,'#163a32ed');poly(c,[[-6,-8],[9,0],[-6,8]],'#ffe290','#354b38');c.restore();
    }
   }
   function drawRoom(){

    const floor=['#ad7d53','#956d53','#858297'][state.profile.theme]||'#ad7d53';
    const rug=['#2e6352','#8c5339','#4b5682'][state.profile.theme]||'#2e6352';
    box(c,-303,-224,606,498,22,'#17362b8c');
    box(c,-302,-240,604,504,22,'#614635','#dbad6c');
    box(c,-280,-170,560,414,14,floor,'#755346');
    for(let y=-160;y<240;y+=24)line(c,[[-276,y],[276,y]],'#583d2c51',2);
    box(c,-278,-218,556,61,12,'#936347','#614536');
    for(const x of [-205,205]){
     box(c,x-53,-210,106,41,4,'#fbe6ad','#7b543e');
     for(let j=-39;j<=39;j+=26)line(c,[[x+j,-209],[x+j,-171]],'#a37b54',3);
     line(c,[[x-53,-191],[x+53,-191]],'#a37b54',3);
    }
    box(c,-181,-212,362,43,8,'#284a3e','#d5af6f');
    c.textAlign='center';c.textBaseline='middle';c.font='900 20px system-ui';c.fillStyle='#ffe6a8';c.fillText('HALL OF ACHIEVEMENTS',0,-190);

    box(c,-227,-148,454,251,14,rug,'#ffffff2c');
    box(c,-70,115,140,99,10,rug,'#d4b577');

     const halo=c.createRadialGradient(x,-142,3,x,-142,67);halo.addColorStop(0,'#ffe8aab5');halo.addColorStop(1,'#ffe8aa00');
     c.fillStyle=halo;c.fillRect(x-67,-209,134,134);
     box(c,x-11,-160,22,31,6,'#ffdd86','#926640');
     box(c,x-13,-164,26,6,2,'#614536');box(c,x-13,-132,26,6,2,'#614536');
     oval(c,x,182,20,13,'#7a523b');plant(c,districts[0],[x,181,.62,.86]);
    }
    for(const n of state.room.nodes){
     if(n.kind==='room-exit'){badge(c,n.x,n.y,'Dojo grounds','#ffe4a3');continue;}
     oval(c,n.x,n.y+13,42,16,'#14382c65');box(c,n.x-34,n.y-18,68,32,6,'#a57d55','#513d2d');box(c,n.x-38,n.y-26,76,14,4,'#e4bb78','#775640');

     if(award)drawAward(c,award.category,n.x,n.y-43);

    }
    drawAnimal(c,{...actor,id:state.profile.active,scale:1.15,stage:stageOf(state.profile.fighterXP[state.profile.active]||0),motion:moving?3:0},state.clock);
    c.restore();
   }
  }
  const point=(event)=>({x:projected.x+event.offsetX/z,y:projected.y+event.offsetY/z});
  return {resize,draw,point};
 }
 function portraits(root){
  for(const canvas of root.querySelectorAll('[data-portrait]')){

 }
 function awardArt(root){

 function drawAward(c,category,x,y){

   if(category==='Discovery')poly(c,[[x,y-31],[x+18,y-8],[x,y+9],[x-18,y-8]],tint,'#fcf0c7');
   else if(category==='Mastery')poly(c,[[x,y-31],[x+7,y-16],[x+23,y-15],[x+11,y-4],[x+14,y+12],[x,y+4],[x-15,y+12],[x-12,y-4],[x-23,y-15],[x-7,y-16]],tint,'#fcf0c7');
   else if(category==='World challenges')poly(c,[[x-22,y-15],[x-16,y-28],[x+16,y-28],[x+22,y-15],[x+12,y+7],[x-12,y+7]],tint,'#fcf0c7');
   else{
    c.strokeStyle=tint;c.lineWidth=5; c.beginPath();c.ellipse(x,y-13,24,12,0,0,TAU);c.stroke();
    poly(c,[[x-17,y-29],[x+17,y-29],[x+12,y-7],[x+4,y],[x+4,y+10],[x-4,y+10],[x-4,y],[x-12,y-7]],tint,'#fcf0c7');
    line(c,[[x-9,y-24],[x-6,y-13]],'#fff3c3',3);
   }
 }
 window.BEAST_ART={create,portraits,awardArt};
})();

<script>
'use strict';
(() => {
 const engine=window.BEAST_ENGINE, art=window.BEAST_ART;
 const {districts,fighters,trophies,bosses,arenaModes,stageOf,levelCap,levelProgress,botTiers,boosts,boostRemaining,owned,has,trophyProgress,districtSeals,unlockRule,distance,walkable}=engine;
 const $=id=>document.getElementById(id), shell=$('game'), canvas=$('world'), panel=$('panel'), overlay=$('overlay');
 const scene=art.create(canvas);

 const input={keys:new Set(),stick:{x:0,y:0},pad:{x:0,y:0},kind:matchMedia('(pointer:coarse)').matches?'touch':'keys',padButtons:[]};

 let fightResult=null, activityResult=null, audio=null, pendingNode=null, queue=null, practice=null;
 const demoWait=8;
 const queueSeconds=()=>Math.floor((performance.now()-queue.started)/1000);
 const text=s=>String(s).replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
 const action=(label,key,{primary=false,disabled=false}={})=>'<button type="button" data-command="'+key+'" class="'+(primary?'primary':'')+'" '+(disabled?'disabled':'')+'>'+text(label)+'</button>';
 const card=(title,html,cls='')=>'<article class="entry '+cls+'"><h3>'+text(title)+'</h3>'+html+'</article>';
 const paragraph=s=>'<p>'+text(s)+'</p>';
 const row=html=>'<div class="panel-actions">'+html+'</div>';
 const grid=items=>'<div class="panel-grid">'+items.join('')+'</div>';
 function progressLabel(xp){
  const {level,remaining}=levelProgress(xp);
  return 'Lv. '+level+' / '+levelCap+' · '+stageOf(xp)+' · '+(remaining?remaining+' XP to next level':'Max level');
 }
 function progressNote(progress){
  return progress.level>progress.before?paragraph(progress.fighter+' reached Level '+progress.level+' · '+stageOf(state.profile.fighterXP[state.profile.active])):'';
 }
 function toast(s){$('toast').textContent=s;$('toast').hidden=false;toastUntil=performance.now()+3000;}
 function sound(kind){
  if(!state.profile.settings.sound||!audio||audio.state!=='running')return;
  const frequency={step:590,hit:182,swing:335,guard:700,hurt:115,dash:260}[kind]||440;
  const voice=audio.createOscillator(),env=audio.createGain(),now=audio.currentTime;
  voice.type=kind==='hit'?'triangle':'sine';voice.frequency.setValueAtTime(frequency,now);
  voice.frequency.exponentialRampToValueAtTime(Math.max(45,frequency*.63),now+.12);
  env.gain.setValueAtTime(.08,now);env.gain.exponentialRampToValueAtTime(.001,now+.16);
  voice.connect(env);env.connect(audio.destination);voice.start(now);voice.stop(now+.17);
 }
 function initAudio(){
  try{audio ||= new (window.AudioContext||window.webkitAudioContext)();audio.resume().catch(()=>{});}catch{}
 }
 const storage=showroom?{getItem:()=>null,setItem:()=>{}}:{
  getItem:k=>localStorage.getItem(k),setItem:(k,v)=>localStorage.setItem(k,v)
 };
 const game=engine.makeGame(storage,{
  toast,sound,arrive:interact,
  activity:a=>{if(a.pattern)show('challenge');},
  activityResult:r=>{activityResult=r;show('activity-result');},
  fight:()=>{closePanel();updateHUD();},
  fightResult:r=>{fightResult=r;show('fight-result');}
 });
 const state=game.state;
 const fighter=()=>fighters[state.profile.active];
 function setInput(kind){
  if(input.kind!==kind){input.kind=kind;updateHUD();}
 }
 function show(id,remember=true){

 }
 function closePanel(){

 }
 function paintPanel(){

   body=grid([
    card('Keyboard',paragraph('WASD or arrow keys move. E interacts. J strikes, K uses a style skill, I uses a charged signature, L parries, Space dashes and R tags your backup.')),
    card('Touch',paragraph('Drag the left stick to walk or tap a marked place to approach. Use the action buttons on the right. Signature lights up when it is ready.')),
    card('Gamepad',paragraph('Left stick moves. A / Cross interacts, X / Square strikes, Y / Triangle uses skill, B / Circle guards, LB / L1 dashes, RT / R2 uses your signature and RB / R1 tags. Menu opens the journal. Use the directional pad to select.')),
    card('Progress',paragraph('Quests, fighters, trophies and room decorations save in this browser. The world restores the last district you reached.'))
   ]);
   if(modal==='settings'){
    body+=row(action(p.settings.sound?'Sound on':'Sound off','setting:sound')+action(p.settings.motion?'Effects on':'Reduced effects','setting:motion')+action(p.settings.touch?'Touch controls on':'Touch controls auto','setting:touch'));
    body+=paragraph('Browser save status · '+state.status)+row(action('Restart adventure…','reset-confirm'));
   }
  }else if(modal==='reset-confirm'){
   title='Restart adventure?';category='Settings';
   body=paragraph('This clears the Beast Dojo progress stored by this browser. The next session starts in Dojo Valley.')+row(action('Keep my progress','panel:settings',{primary:true})+action('Reset browser save','reset'));
  }else if(modal==='mentor'){

   body+=grid(districts.map(d=>card(d.name,paragraph(d.chapter)+
    '<small>'+(['Find the mentor','Complete both activities','Win the guided spar','Return to the mentor','Chapter complete'][p.quests[d.index]])+' · '+districtSeals(p,d.index)+'/3 seals</small>'+action('View district','region:'+d.index))));
  }else if(modal==='fighters'){
   title='Fighter collection';category=fighters.filter(f=>owned(p,f.id)).length+' of '+fighters.length+' available';
   body='<div class="filters"><label for="fighter-filter">Element</label><select id="fighter-filter">'+['All','Land','Aquatic','Magma','Sky'].map(k=>'<option '+(k===fighterFilter?'selected':'')+'>'+k+'</option>').join('')+'</select></div>';
   body+=grid(fighters.filter(f=>fighterFilter==='All'||f.element===fighterFilter).map(f=>{

     paragraph(unlocked?progressLabel(xp):unlockRule(f.id).label)+

   body+=row(action(state.room?'Walk around the room':'Enter trophy room',state.room?'close':'enter-room',{primary:true})+action('Change room style','theme')+action('Browse collection','panel:trophies')+(state.room?action('Return to the grounds','exit-room'):'')+'<a class="game-link" href="?showroom=1" target="_blank" rel="noopener">See a furnished room</a>');
  }else if(modal==='slot'||modal==='pick'){

  }else if(modal==='arena'||modal==='ring'){

   const targets=[...panel.querySelectorAll('button:not(:disabled),select,a[href]')];
   const selected=document.activeElement;
   if(selected.matches('select')&&(edges[14]||edges[15])){
    selected.selectedIndex=(selected.selectedIndex+(edges[14]?-1:1)+selected.options.length)%selected.options.length;
    selected.dispatchEvent(new Event('change',{bubbles:true}));
   }else if(edges[12]||edges[13]||edges[14]||edges[15]){
    const index=targets.indexOf(document.activeElement), delta=(edges[12]||edges[14])?-1:1;
    targets[(Math.max(0,index)+delta+targets.length)%targets.length]?.focus();
   }
   if(edges[0]&&document.activeElement.matches('button,a[href]'))document.activeElement.click();
   if(edges[1])closePanel();
   return;
  }
  if(!started){if(edges[0])start();return;}
  if(edges[9]){show(state.fight?'pause':state.activity?'activity-pause':'journal');return;}
  if(edges[0]&&!state.fight)interact();
  if(edges[2])playAction('attack');
  if(edges[3])playAction('skill');
  if(edges[1])playAction('guard');
  if(edges[4])playAction('dash');
  if(edges[5])playAction('tag');
  if(edges[7])playAction('ultimate');
  if(edges[12]&&!state.fight&&!state.activity)show('map');
  if(edges[13]&&!state.fight&&!state.activity)show('trophies');
 }
 function frame(now){
  const dt=Math.min(.045,(now-frameTime)/1000||0);frameTime=now;
  if(!showroom)gamepad();
  const motion=movement();
  if(started&&!showroom&&(!modal||modal==='challenge'))game.tick(dt,modal?{x:0,y:0}:motion);
  if(now-lastUI>86){updateHUD();updateTimedPanels();lastUI=now;}
  if(now>toastUntil)$('toast').hidden=true;
  updateActivity();
  scene.draw(state,{title:!started,reduce:!state.profile.settings.motion,moving:!!(motion.x||motion.y||state.target)});
  requestAnimationFrame(frame);
 }
 new ResizeObserver(()=>scene.resize()).observe(canvas);scene.resize();
 shell.dataset.input=input.kind;
 if(showroom){
  started=true;$('title-screen').hidden=true;$('showroom').hidden=false;
  state.profile.shelf=['journey-01','discovery-valley','mastery-coast','arena-01','world-01','journey-06'];
  const awards=$('showroom-awards');awards.hidden=false;
  awards.innerHTML=state.profile.shelf.map(id=>'<li>'+text(trophies.find(t=>t.id===id).name)+'</li>').join('');
  game.enterRoom();canvas.setAttribute('aria-label','Furnished trophy room with six sample awards on display');
 }
 state.objective=game.objective();
 requestAnimationFrame(frame);
})();
