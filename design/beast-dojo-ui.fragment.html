const title=(name,desc,extra='')=>`<div class="screen-title"><div><h2>${name}</h2>${desc?`<p>${desc}</p>`:''}</div>${extra}</div>`;
const bar=(name,amount,pct,fill='#54d5af')=>`<div><div class="progress-label"><b>${name}</b><span>${amount}</span></div><div class="progress" style="--value:${pct}%;--fill:${fill}"><span></span></div></div>`;
const portraitStage=(f=state.fighter,label=fighters[f].name)=>`<div class="hero-stage"><div class="hero-corner">${elBadge(fighters[f])}</div><span class="hero-level">Lv. ${fighters[f].level}</span>${actor(f)}<div class="hero-label"><b>${label}</b> · ${fighters[f].class}</div></div>`;
function hydrate(){if(globalThis.lucide?.createIcons)globalThis.lucide.createIcons({attrs:{'stroke-width':2.2}})}
function toast(text){const t=root.querySelector('#bd-toast');t.textContent=text;t.hidden=false;clearTimeout(toastTimer);toastTimer=setTimeout(()=>t.hidden=true,3000)}
function closeModal(){modal.hidden=true;modal.innerHTML='';if(modalTrigger?.isConnected)modalTrigger.focus()}
function showModal(heading,body,buttons){modalTrigger=document.activeElement;modal.innerHTML=`<section class="modal" role="dialog" aria-modal="true" aria-label="${heading}"><button class="modal-x" data-action="close-modal" aria-label="Close dialog">${icon('x')}</button><h2>${heading}</h2>${body}<div class="row">${buttons}</div></section>`;modal.hidden=false;hydrate();modal.querySelector('button')?.focus()}
function goto(route){clearTimeout(toastTimer);root.querySelector('#bd-toast').hidden=true;state.route=route;state.review='mockup';root.querySelector('#bd-product-view').hidden=false;root.querySelector('#bd-research-view').hidden=true;root.querySelectorAll('[data-review]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.review==='mockup'));closeModal();render();persist()}
function persist(){globalThis.openai?.setWidgetState?.({modelContent:{screen:state.route,input:state.input,selectedFighter:fighters[state.fighter].name},privateContent:{review:state.review}}).catch(()=>{})}
function nav(){root.querySelector('#bd-rail').innerHTML=routes.map(([id,n,i])=>`<button data-route="${id}" class="${state.route===id?'active':''}" ${state.route===id?'aria-current="page"':''}>${icon(i)}<span>${n}</span></button>`).join('');root.querySelector('#bd-screen-picker').innerHTML=allRoutes.map(([id,n])=>`<option value="${id}" ${id===state.route?'selected':''}>${n}</option>`).join('')}
function lobby(){return `<div class="lobby-grid"><div class="lobby-copy"><span class="eyebrow">Grand Bamboo Dojo · Season 1</span><h1>Ready to<br>make a splash?</h1><p class="body-copy">Pick your fighter. Find your rhythm.<br>Send your rivals flying.</p><button class="mode-choice" data-route="play">${icon('swords')}<span><b>${state.mode==='Brawl'?'King of the Ring':state.mode}</b><small>${state.mode==='Brawl'?'8 fighters · 60-second brawl':'Choose your arena and rules'}</small></span>${icon('chevron-right')}</button>${action(`${icon('play')} Play ${state.mode}`,'queue')}<div class="row">${action(`${icon('target')} Practice`,'practice','secondary')}${action(`${icon('users')} Party`,'party','secondary')}</div></div>${portraitStage()}</div><div class="quest-strip"><div class="panel">${icon('sparkles')}<div style="flex:1">${bar('Warrior evolution','Lv. 14 → 15',78)}<small>Keep training to unlock your next form.</small></div></div><div class="panel">${icon('target')}<div><b>Daily quest · Land 10 hits</b><small>7 / 10 hits · Reward: 120 Coins</small></div><button class="filter" data-route="season">View</button></div></div>`}
function collection(){const filtered=fighters.map((f,i)=>({...f,i})).filter(f=>(state.element==='All'||f.element===state.element)&&f.name.toLowerCase().includes(state.search.toLowerCase()));return title('Your fighters','4 collected · 24 in the launch roster',action(`${icon('repeat-2')} Trade`,'trade-link','secondary'))+`<div class="roster-controls"><input type="search" id="bd-search" placeholder="Find a fighter" aria-label="Find a fighter" value="${esc(state.search)}">${['All','Land','Aquatic','Magma','Sky'].map(e=>`<button class="filter" data-filter="${e}" aria-pressed="${state.element===e}">${e}</button>`).join('')}</div><div class="roster-grid">${filtered.map(f=>`<button class="fighter-tile ${state.fighter===f.i?'selected':''}" data-fighter="${f.i}" aria-label="${f.name}, ${f.element}, ${f.rarity}, level ${f.level}${state.fighter===f.i?', equipped':''}"><span class="tile-state">${state.fighter===f.i?'✓ EQUIPPED':`Lv. ${f.level}`}</span><div class="fighter-art" style="--tile:${f.color}">${actor(f.i)}</div><div class="fighter-info"><b>${f.name}</b><div class="chip-row">${elBadge(f)}${badge(f.rarity,'rarity',`--rarity:${f.rarity==='Rare'?'#7cb9ff':'#cad5db'}`)}</div><small>${f.class} · ${f.i===0?'Standard breed':'Normal mutation'}</small></div></button>`).join('')}${state.element==='All'&&!state.search?[['Electric Owl','Sky'],['Honey Badger','Land']].map(([n,e])=>`<button class="fighter-tile" data-action="locked-fighter" aria-label="${n}, locked"><div class="lock-art">${icon('lock-keyhole')}</div><div class="fighter-info"><b>${n}</b>${badge(e)}<small>Earn through progression</small></div></button>`).join(''):''}</div>${!filtered.length?`<div class="notice">${icon('search')}No fighters found. Try All elements or clear your search.</div>`:''}<div class="footer-actions">${action('View fighter','detail','secondary')}${action('Edit loadout','loadout')}</div>`}
function detail(){let f=fighters[state.fighter];return title(f.name,'Fighter profile · preview base stats; actual match stats depend on mode rules.')+`<div class="split">${portraitStage()}<div class="stack"><div class="panel"><div class="chip-row">${elBadge(f)}${badge(f.class)}${badge(f.rarity,'rarity',`--rarity:${f.rarity==='Rare'?'#7cb9ff':'#cad5db'}`)}</div><div class="stats">${[['HP',f.hp],['ATK',f.atk],['Knockback',f.kb],['Speed',f.speed]].map(([n,v])=>`<div class="stat"><b>${v}</b><small>${n}</small></div>`).join('')}</div></div><div class="panel"><h3>${f.class==='Heavy'?'Unmovable':'Slippery'}</h3><p class="body-copy">${f.class==='Heavy'?'Heavy fighters resist launches and light staggers.':'Agile fighters recover faster from stuns and gain a brief burst after dashing.'}</p></div>${bar('Animal XP',`Level ${f.level}`,78)}<div class="row">${action('Edit moves','loadout')}${action('Evolution','evolution','secondary')}${action('Cosmetics','cosmetics','secondary')}</div></div></div>`}
function loadout(){return title('Make it your move','Three active skills. One universal Dash / Parry. Choose a move in each slot.')+`<div class="skill-grid">${[['Basic strike','hand','Quick close-range combo.','Jab combo','Sweeping jab'],['Tactical move','move-up-right','Close distance and control space.','Bounding strike','Counter stance'],['Ultimate','zap','A signature move with a big launch.','Reedstep Rising','Rising cyclone']].map(([n,i,d,a,b],s)=>`<div class="skill-slot"><div class="slot-icon">${icon(i)}</div><div class="slot-meta"><span class="eyebrow">Slot ${s+1}</span><h3>${n}</h3><p>${d}</p></div>${[a,b,'Master variant'].map((v,j)=>`<button class="variant ${state.variants[s]===j?'selected':''}" data-variant-slot="${s}" data-variant-index="${j}" ${j===2?'disabled':''}>${icon(j===2?'lock-keyhole':state.variants[s]===j?'check-circle-2':'circle')}${v}${j===2?' · locked':''}</button>`).join('')}</div>`).join('')}</div><div class="notice">${icon('shield')}Dash / Parry is always available separately from these three slots.</div><div class="footer-actions">${action('Revert','revert-loadout','secondary')}${action(`${icon('check')} Save loadout`,'save-loadout')}</div>`}
function evolution(){return title('Grow into a Grandmaster','Three evolution stages. Your fighter keeps its identity.')+`<div class="split">${portraitStage(state.fighter,['Rookie','Warrior','Grandmaster'][state.evolution])}<div class="stack"><div class="row">${['Rookie','Warrior','Grandmaster'].map((n,i)=>`<button class="filter" data-evolution="${i}" aria-pressed="${state.evolution===i}">${n}</button>`).join('')}</div><div class="panel"><span class="eyebrow">${['Levels 1–14','Levels 15–29','Level 30'][state.evolution]}</span><h2 style="margin:8px 0">${['Rookie','Warrior','Grandmaster'][state.evolution]}</h2><p class="body-copy">${['Your first steps in the dojo. Learn the kit and build your mastery.','Elemental wraps, armor details and a stronger silhouette.','Championship details, a crown or belt, and an elemental aura.'][state.evolution]}</p></div>${bar('Next evolution','Level 15 required',78)}${action('Keep training','practice')}${action('Back to fighter','detail','secondary')}</div></div>`}
function modes(){return title('Choose your clash','One fighter, four ways to play.',badge('Party: 1 / 4'))+`<div class="mode-grid">${[['Ranked Duel','swords','1v1 · Best of 3 · 45s per round','Trophies and competitive rules'],['Tag Team','repeat-2','2v2 · 90-second match','Primary + backup fighter'],['Brawl','crown','8 fighters · 60-second match','Shrinking ring · Full progression stats'],['Boss Raid','shield','4-player co-op · Scheduled event','Telegraphed attacks · Raid Tokens']].map(([n,i,d,r])=>`<button class="mode-card ${state.mode===n?'selected':''}" data-mode="${n}">${icon(i)}<b>${n}</b><p>${d}</p><small>${r}</small></button>`).join('')}</div><div class="notice">${icon('map-pin')}Arena preview: Grand Bamboo Dojo · Gong bumpers along the ring.</div><div class="footer-actions">${action('Practice first','practice','secondary')}${action(`Find ${state.mode} match`,'queue')}</div>`}
function combat(){let b={keyboard:['Mouse1','E','R','Q','Space'],touch:['','','','',''],controller:['X / □','Y / △','RB / R1','LB / L1','A / ×'],vr:['Trigger','Grip','B','A','Stick']}[state.input];let m=state.mode;return `<div class="battle"><div class="battle-top"><div><div class="hp-name"><span>${m==='Boss Raid'?'Mecha-Kong':'YOU'}</span><span>${m==='Boss Raid'?'Phase 2':'2 ●'}</span></div><div class="hp"><span style="--hp:${m==='Boss Raid'?58:78}%"></span></div></div><div class="timer">0:42<small>${m==='Ranked Duel'?'ROUND 1':m==='Brawl'?'3 LEFT':m==='Boss Raid'?'BOSS RAID':'TAG TEAM'}</small></div><div><div class="hp-name"><span>${m==='Boss Raid'?'TEAM':'PENGUIN'}</span><span>${m==='Boss Raid'?'4 / 4':'1 ●'}</span></div><div class="hp"><span style="--hp:${Math.max(10,64-state.damage)}%;--hpcolor:#6bcbf2"></span></div></div></div><div class="ring-label">GRAND BAMBOO DOJO</div>${actor(state.fighter,'battle-character')}${actor(1,'battle-character enemy')}<div class="hazard-label">${m==='Brawl'?'RING SHRINKS IN 3s':m==='Boss Raid'?'GROUND SLAM · MOVE OUT':m==='Tag Team'?'BACKUP READY':'STAY INSIDE THE RING'}</div>${state.damage?`<div class="hit-popup">65</div>`:''}<div class="combat-bottom"><div class="player-hp"><b>${fighters[state.fighter].short} · ${Math.round(fighters[state.fighter].hp*.78)} / ${fighters[state.fighter].hp.toLocaleString()} HP</b><div class="hp"><span style="--hp:78%"></span></div><small>${m==='Tag Team'?'Backup: Gorilla · Ready':'Agile · No active effects'}</small></div><div class="touch-stick" role="img" aria-label="Reserved Roblox movement control"></div><div class="skills-bar">${[['hand','Jab','basic'],['move-up-right','Tactical','tactical'],['zap','Ultimate','ultimate'],['shield','Dash','dash'],['arrow-up','Jump','jump']].map(([i,n,a],k)=>`<button class="skill-button ${a} ${k===4?'touch-jump':''} ${a==='basic'&&state.cooldown?'cooldown':''}" data-action="${a==='basic'?'hit':a==='ultimate'?'ultimate':a==='jump'?'jump':'combat-action'}" aria-label="${n}${b[k]?', '+b[k]:''}" ${a==='basic'&&state.cooldown?'disabled':''}>${a==='basic'&&state.cooldown?'<span class="cooldown-number">1.6</span>':icon(i)}<span>${n}</span><span class="binding">${b[k]}</span></button>`).join('')}</div></div></div><div class="combat-meta"><span>${state.input==='vr'?'Comfort view · camera shake off':m==='Boss Raid'?'Party: You · Moss · Puddle · Ember':'Grand Bamboo Dojo'}</span><button class="filter" data-route="results">Match results</button></div>${m==='Tag Team'?`<div class="notice">${icon('repeat-2')}Gorilla backup · ${action('Tag In','tag','secondary')}</div>`:m==='Boss Raid'?`<div class="notice">${icon('heart-pulse')}Party: You · Moss · Puddle · Ember · ${action('Revive teammate','revive','secondary')}</div>`:''}`}
function results(){return `<div class="result-hero"><span class="eyebrow">King of the Ring · Match complete</span><h1>VICTORY!</h1>${actor()}<div class="chip-row" style="justify-content:center">${badge('1st place','success')}${badge('3 knockouts')}${badge('No damage bonuses purchased')}</div></div><div class="reward-grid">${[['coins','Coins','+180'],['sparkles','Animal XP','+320'],['trophy','Trophies','+24']].map(([i,n,v])=>`<div class="reward-cell">${icon(i)}<b>${v}</b><small>${n}</small></div>`).join('')}</div><div class="panel">${bar('Warrior evolution','Level 14 · 78%',78)}</div><div class="footer-actions">${action('Back to dojo','lobby','secondary')}${action('Play again','queue')}</div>`}
function shop(){return title('Make your knockout yours','Guaranteed cosmetics. Preview the exact item before you buy.')+`<div class="shop-grid">${[['party-popper','Confetti burst','A cheerful ring-out finish.','99'],['orbit','Black hole','A dramatic cosmic finish.','199'],['flame','Meteor strike','An ember-filled ring-out finish.','249']].map(([i,n,d,p])=>`<div class="panel"><div class="shop-art">${icon(i)}</div><span class="eyebrow">Knockout finisher</span><h3>${n}</h3><p>${d}</p>${action('Preview','preview-'+i,'secondary')}${action(`${p} Robux`,'buy-'+p)}</div>`).join('')}</div><div class="notice">${icon('info')}Cosmetics change your style, not your combat stats.</div><div class="footer-actions">${action('Earned capsules','capsules','secondary')}${action('Season rewards','season','secondary')}</div>`}
function capsules(){return title('Rewards from the ring','These capsules were earned directly through gameplay.',badge('2 unopened'))+`<div class="split"><div class="capsule-art"><div class="capsule" role="img" aria-label="Gold earned reward capsule">${icon('paw-print')}</div></div><div class="stack"><div class="panel"><span class="eyebrow">Match milestone reward</span><h2 style="margin:8px 0">Starter capsule</h2><p class="body-copy">A new fighter might be waiting inside. Earn more capsules by completing match milestones.</p><div class="chip-row" style="margin-top:14px">${badge('Common · 75%','rarity')}${badge('Rare · 25%','rarity','--rarity:#7cb9ff')}</div></div>${action('View contents & details','capsule-details','secondary')}${action(`${icon('sparkles')} Open earned capsule`,'open-capsule')}</div></div><div class="notice">${icon('shield-check')}Looking for a particular look? The shop offers guaranteed cosmetics.</div>`}
function season(){return title('Season 1 · Rise of the Dojo','Play, complete quests, and claim your earned rewards.',action('View quests','quests','secondary'))+`<div class="season-banner"><div><span class="eyebrow" style="color:#b4c4c3">Season journey</span><h2 style="margin:8px 0">Your next reward is close.</h2><small>Tier 22 / 50 · 280 / 400 season XP</small></div>${action('View premium rewards','premium','secondary')}</div><div style="margin-top:18px">${bar('Season XP','280 / 400',70)}</div><div class="tiers">${[20,21,22,23,24,25].map((t,i)=>`<button class="tier ${i<2?'claimed':i===2?'current':''}" data-action="${i===2?'claim-tier':'tier-info'}">${badge(`Tier ${t}`)}${icon(['coins','smile','sparkles','party-popper','coins','crown'][i])}<b>${['120 Coins','Emote','100 XP','Finisher','180 Coins','Crown skin'][i]}</b><small>${i<2?'✓ Claimed':i===2?(state.claimed?'✓ Claimed':'Claim reward'):'Locked'}</small></button>`).join('')}</div><div class="notice">${icon('target')}Daily quest · Land 10 hits · 7 / 10 · Reward: 120 Coins</div>`}
function dojo(){return title('Bamboo Breakers','Player dojo · 18 / 30 members',badge('Member','success'))+`<div class="split"><div class="stack"><div class="panel"><span class="eyebrow">Dojo level 3</span><h2 style="margin:8px 0">Train together.<br>Climb together.</h2><p class="body-copy">Contribute Coins to your shared dojo perks.</p><div style="margin-top:16px">${bar('Next dojo level','7,800 / 10,000 Coins',78)}</div><div class="row" style="margin-top:16px">${action('Donate Coins','donate')}${action('Party up','party','secondary')}</div></div><div class="panel"><h3>Weekly dojo war</h3><div class="member"><span>Your dojo</span><b>12th · 4,280 points</b></div><div class="member"><span>Contribution</span><b>340 points</b></div>${action('View standings','standings','secondary')}</div></div><div class="panel"><h3>Dojo members</h3><div class="member-list">${[['BambooBen','Leader · Online'],['You','Member · Online'],['PuddlePunch','Member · Online'],['MossMitts','Member · Offline']].map(([n,s],i)=>`<div class="member"><span><span class="dot ${i===3?'offline':''}"></span>${n}</span><small>${s}</small></div>`).join('')}</div><div class="row" style="margin-top:16px">${action('Invite friend','invite','secondary')}${action('Trade plaza','trade-link','secondary')}</div></div></div>`}
function trade(){const remain=Math.max(0,Math.ceil((state.tradeReadyAt-Date.now())/1000));return title('Trade with PuddlePunch','Review each fighter, breed, mutation and level before confirming.',action('Eligibility notice','trade-policy','secondary'))+`${state.tradePolicy?`<div class="notice" role="alert">${icon('shield-alert')}Paid-item trading is unavailable for this account or item. Your fighters stay in your collection.</div>`:''}<div class="trade-grid"><div class="panel"><span class="eyebrow">Your offer</span><h3 style="margin-top:8px">You give</h3><div class="trade-item">${actor(0)}<div><b>Reedguard Kangaroo</b><small>Lv. 14 · Common</small><small>Standard · Normal</small></div></div><div class="row" style="margin-top:16px">${action('Change offer','change-offer','secondary')}</div></div>${icon('arrow-left-right')}<div class="panel"><span class="eyebrow">Their offer</span><h3 style="margin-top:8px">You receive</h3><div class="trade-item">${actor(1)}<div><b>Penguin Brawler</b><small>Lv. 8 · Common</small><small>Standard · Normal</small></div></div><div class="notice">${icon('info')}Item values can change. Confirm the items themselves.</div></div></div><label class="trade-check"><input id="bd-trade-check" type="checkbox" ${state.tradeChecked?'checked':''} ${state.tradePolicy?'disabled':''}>I have checked both offers and understand this exchange.</label><div class="notice">${icon('timer')}<span>${state.tradeStage===0?'Any offer change resets both confirmations and starts a 5-second lock.':remain?`Offers locked · Review available in ${remain}s`:'Lock complete. Review the exact exchange once more.'}</span></div><div class="footer-actions">${action('Cancel trade','cancel-trade','secondary')}${action(state.tradeStage?(remain?`Locked · ${remain}s`:'Review exchange'):'Lock my offer',state.tradeStage?'review-trade':'lock-trade','positive',state.tradePolicy||Boolean(remain)||(!state.tradeStage&&!state.tradeChecked))}</div>`}
function ranked(){return title('Your ranked journey','Six divisions. Clear rules. A fresh challenge each season.')+`<div class="season-banner"><div>${icon('trophy')}<h2 style="margin:12px 0">Gold · 1,280 trophies</h2><small>Next division: Diamond</small></div>${action('Play Ranked Duel','ranked-queue')}</div><div style="margin-top:20px">${bar('Division progress','1,280 / 1,500',85,'#f4bd4f')}</div><div class="row" style="margin-top:20px">${['Bronze','Silver','Gold','Diamond','Master','Apex Predator'].map(n=>badge(n,n==='Gold'?'warn':'')).join('')}</div><div class="notice">${icon('scale')}Ranked rules · Level 15 cap · Best of 3 rounds · 45 seconds per round.</div><div class="panel" style="margin-top:18px"><h3>Season standings</h3><div class="member"><span>1 · MossMitts</span><b>4,120 trophies</b></div><div class="member"><span>2 · EmberHop</span><b>3,940 trophies</b></div><div class="member"><span>You</span><b>1,280 trophies</b></div></div>`}
function settings(){return title('Make yourself comfortable','Settings adapt to your active input and screen.')+`<div class="split"><div class="panel"><h3>Accessibility</h3><div class="setting"><label for="bd-large">Larger text<small>Increase menu text size.</small></label><input id="bd-large" type="checkbox" ${state.large?'checked':''}></div><div class="setting"><label for="bd-reduced">Reduced motion<small>Reduce zooms and reward movement.</small></label><input id="bd-reduced" type="checkbox" ${state.reduced?'checked':''}></div><div class="setting"><label for="bd-high">Higher contrast<small>Stronger labels and boundaries.</small></label><input id="bd-high" type="checkbox" ${state.high?'checked':''}></div><div class="setting"><label for="bd-captions">Visual sound cues<small>Keep important events visible.</small></label><input id="bd-captions" type="checkbox" checked></div></div><div class="panel"><h3>Sound & controls</h3><div class="setting"><label for="bd-appearance">Menu appearance</label><select id="bd-appearance"><option value="system" ${state.appearance==='system'?'selected':''}>Follow device</option><option value="day" ${state.appearance==='day'?'selected':''}>Day dojo</option><option value="night" ${state.appearance==='night'?'selected':''}>Night dojo</option></select></div><div class="setting"><label for="bd-volume">Master volume</label><input id="bd-volume" type="range" value="70" min="0" max="100" aria-label="Master volume"></div><div class="setting"><label for="bd-graphics">Graphics</label><select id="bd-graphics"><option>Auto</option><option>Low</option><option>Medium</option><option>High</option></select></div><div class="setting"><label for="bd-shake">Camera shake<small>Always off in VR.</small></label><input id="bd-shake" type="checkbox" ${state.input==='vr'?'disabled':'checked'}></div><div class="row" style="margin-top:18px">${action('View controls','controls','secondary')}${action('Replay tutorial','tutorial','secondary')}</div></div></div>`}
function onboarding(){return title('Welcome to the dojo','A short, replayable tutorial gets you into the ring.')+`<div class="split">${portraitStage()}<div class="stack"><div class="panel"><span class="eyebrow">Step 2 / 4</span><h2 style="margin:10px 0">Time your dash.</h2><p class="body-copy">Dash through the training marker, then use a strike to push the dummy toward the ring edge.</p><div class="notice">${icon('shield')}Dash / Parry · ${state.input==='touch'?'Tap the shield button':state.input==='controller'?'LB / L1':'Q'}</div></div>${action('Try the combat HUD','practice')}${action('Skip for now','lobby','secondary')}<div class="row">${action('Loading state','loading-state','secondary')}${action('Connection state','connection-state','secondary')}</div></div></div>`}
function render(){nav();game.dataset.input=state.input;game.dataset.route=state.route;root.querySelector("#bd-battle-scenario").hidden=state.route!=="combat";root.querySelector("#bd-trade-scenario").hidden=state.route!=="trade";game.dataset.large=state.large;game.dataset.high=state.high;root.dataset.reduced=state.reduced;screen.innerHTML=({lobby,fighters:collection,detail,loadout,evolution,play:modes,combat,results,shop,capsules,season,dojo,trade,ranked,settings,onboarding}[state.route]||lobby)();hydrate()}
function review(view){state.review=view;root.querySelector('#bd-product-view').hidden=view!=='mockup';const out=root.querySelector('#bd-research-view');out.hidden=view==='mockup';root.querySelectorAll('[data-review]').forEach(b=>b.setAttribute('aria-pressed',b.dataset.review===view));if(view==='mockup')return;
if(view==='palette'){const groups=[['Foundation',['ink','surface','elevated','parchment','paper','mutedDark','mutedLight','borderDark','borderLight','focus']],['Actions & feedback',['gold','goldPressed','jade','jadePressed','health','danger','warning','success']],['Elements',['land','aquatic','magma','sky']],['Rarity',['common','rare','epic','legendary','mythic']]];out.innerHTML=`<div class="review-page"><h2>A warm dojo. A clear fight.</h2><p>Deep blue-green and parchment form the canvas. Gold identifies the main action. Jade marks equipped and positive states. Element and rarity always retain their own labels.</p>${groups.map(([n,ks])=>`<h3>${n}</h3><div class="token-grid" style="margin:12px 0 24px">${ks.map(k=>`<div class="swatch"><div class="swatch-fill" style="background:${data.colors[k].hex};--swatch-text:${['ink','surface','elevated','mutedLight'].includes(k)?'#f7f0dc':'#182b35'}">${data.colors[k].hex}</div><div class="swatch-label"><b>${k}</b>${data.colors[k].role}</div></div>`).join('')}</div>`).join('')}<h3>Typography</h3><div class="type-display">Big personality.<br>Clear information.</div><p>Fredoka One for short display headings. Builder Sans for body text, labels and numbers in Roblox. This browser study uses system rounded/sans fallbacks. Body references: 14 / 16 / 18 / 22. Spacing: 4 / 8 / 12 / 16 / 24 / 32 / 48.</p><h3>Interaction dimensions</h3><p>48px minimum menu targets; 60px preferred combat targets; 8px minimum gaps. Reference text contrast: 4.5:1 for normal text and 3:1 for large text. The project’s approved color pair checks are recorded separately.</p></div>`}
if(view==='components'){out.innerHTML=`<div class="review-page"><h2>The complete UI inventory</h2><p>${data.components.length} reusable components and ${data.screens.length} screen families cover the full GDD. The game mockups illustrate representative screens; the inventory also specifies secondary and failure states.</p><div class="game" aria-label="Component specimen board"><div class="screen" style="min-height:0"><h3>Action and status specimens</h3><div class="row" style="margin:16px 0">${action('Primary action','sample-primary')}${action('Secondary action','sample-secondary','secondary')}${action('Equipped','sample-equipped','positive')}${action('Remove item','sample-remove','danger')}${action('Saving…','sample-loading','',true)}</div><div class="chip-row" style="margin-bottom:16px">${['Land','Aquatic','Magma','Sky'].map((n,i)=>badge(n,'element',`--element:${['#8dd878','#6bcbf2','#ff9274','#f5d46b'][i]}`)).join('')}${['Common','Rare','Epic','Legendary','Mythic'].map((n,i)=>badge(n,'rarity',`--rarity:${['#cad5db','#7cb9ff','#caadff','#f4bd4f','#f797c7'][i]}`)).join('')}</div>${bar('Health','780 / 1,000',78,'#68d391')}<div style="margin-top:16px">${bar('Animal XP','320 / 400',80)}</div><div class="notice">${icon('circle-alert')}Error state: Progress could not be saved. Keep your changes and retry.</div></div></div><h3 style="margin-top:24px">Components</h3><div class="inventory-grid">${data.components.map((c,i)=>`<details><summary><span class="number">${i+1}</span>${c.name}</summary><p>${c.specification}</p></details>`).join('')}</div><h3 style="margin-top:24px">Screen families and states</h3><div class="inventory-grid">${data.screens.map(s=>`<details><summary>${s.name}</summary><p><b>Purpose:</b> ${s.primaryAction}</p><p><b>Elements:</b> ${s.elements}</p><p><b>States:</b> ${s.states}</p></details>`).join('')}</div></div>`}
if(view==='research'){out.innerHTML=`<div class="review-page"><h2>Research into design decisions</h2><p>Researched November 21, 2026. Platform guidance and qualitative interface references inform these proposals. No player usability study or Roblox implementation has been completed.</p>${data.research.map(r=>`<details open><summary>${r.finding}</summary><p>${r.decision}</p><p>${r.kind}</p></details>`).join('')}<h3 style="margin-top:24px">Device rules</h3>${Object.entries(data.devices).map(([k,v])=>`<p><b>${k}:</b> ${v}</p>`).join('')}<h3>Decisions still needed before implementation</h3>${data.openDecisions.map(x=>`<p>${x}</p>`).join('')}<h3>Sources</h3><ol class="source-list">${data.sources.map(s=>`<li><a href="${s.url}" target="_blank" rel="noreferrer">${s.title}</a><br>${s.supports}</li>`).join('')}</ol></div>`}persist()}
function handle(a){switch(a){
case 'close-modal':closeModal();break;case 'lobby':goto('lobby');break;case 'detail':goto('detail');break;case 'loadout':goto('loadout');break;case 'evolution':goto('evolution');break;case 'trade-link':goto('trade');break;case 'season':goto('season');break;case 'capsules':goto('capsules');break;
case 'queue':showModal('Finding your next clash',`<p>${state.mode} · Grand Bamboo Dojo</p><p>Searching for players…</p><div class="notice">${icon('users')}Your selected fighter: ${fighters[state.fighter].name}</div>`,action('Cancel','close-modal','secondary')+action('Match found · Enter','enter-match'));break;
case 'enter-match':case 'practice':closeModal();goto('combat');break;
case 'party':showModal('Your party','<p>You · Party leader · Ready</p><p>Invite friends to fill your party slots. Your party stays together when queueing.</p>',action('Back','close-modal','secondary')+action('Invite friend','invite'));break;
case 'invite':showModal('Invite a friend','<p>PuddlePunch · Online</p><p>MossMitts · Offline</p>',action('Back','close-modal','secondary')+action('Invite PuddlePunch','invited'));break;case 'invited':closeModal();toast('Party invitation sent to PuddlePunch.');break;
case 'locked-fighter':showModal('A new challenger','<p>This fighter is not in your collection yet. Keep playing to earn fighter rewards.</p>',action('Back','close-modal','secondary')+action('View earned capsules','capsules'));break;
case 'save-loadout':toast('Loadout saved.');break;case 'revert-loadout':state.variants=[0,0,0];render();toast('Loadout restored.');break;
case 'cosmetics':showModal('Your fighting style','<p>Finisher: Confetti burst</p><p>Emote: Ready stance</p><p>Showcase pedestal: Active fighter</p>',action('Done','close-modal'));break;
case 'hit':state.damage=Math.min(50,state.damage+7);state.cooldown=1;render();clearTimeout(cooldownTimer);cooldownTimer=setTimeout(()=>{state.cooldown=0;if(state.route==='combat')render()},1600);break;
case 'ultimate':toast('Ultimate ready · '+['Reedstep Rising','Belly-Slide Blitz','Seismic Chest-Pound','Magma Trail'][state.fighter]+'!');break;case 'combat-action':toast('Action triggered.');break;case 'jump':toast('Jump control · separate from skills.');break;case 'tag':toast('Tag-In used · 12-second cooldown.');break;case 'revive':toast('Revive prompt · hold to help your teammate.');break;
case 'capsule-details':showModal('Starter capsule details','<p>Earned from match milestones. This reward does not require Robux or paid Coins.</p><p>Fighter rarity: Common 75% · Rare 25%.</p><p>Paid capsule designs require complete final-outcome odds and eligibility checks before they can be offered.</p>',action('Back','close-modal'));break;
case 'open-capsule':showModal('A new fighter!',`${actor(1)}<p><b>Penguin Brawler</b> · Common · Aquatic</p><p>Standard breed · Normal mutation</p>`,action('Keep in collection','close-modal','secondary')+action('Equip fighter','equip-penguin'));break;case 'equip-penguin':state.fighter=1;closeModal();goto('detail');toast('Penguin Brawler equipped.');break;
case 'claim-tier':state.claimed=true;render();toast('100 XP reward claimed.');break;case 'tier-info':toast('Reward details · earn season XP to advance.');break;
case 'premium':showModal('Season 1 premium rewards','<p>Premium track · 799 Robux</p><p>Preview every cosmetic reward and its tier before continuing. Buying the track does not automatically unlock unfinished tiers.</p>',action('Back','close-modal','secondary')+action('Continue','buy-799'));break;
case 'quests':showModal('Daily quests','<p>Land 10 hits · 7 / 10 · 120 Coins</p><p>Finish 3 matches · 2 / 3 · 100 season XP</p><p>Complete training · 0 / 1 · 80 Coins</p>',action('Back','close-modal'));break;
case 'donate':showModal('Contribute 100 Coins?','<p>Your Coins: 7,400 → 7,300</p><p>Your contribution helps Bamboo Breakers unlock its next dojo level.</p>',action('Cancel','close-modal','secondary')+action('Donate 100 Coins','donated'));break;case 'donated':closeModal();toast('100 Coins contributed to your dojo.');break;
case 'standings':showModal('Weekly dojo standings','<p>10 · Cloud Kickers · 4,680 points</p><p>11 · Ember Club · 4,450 points</p><p>12 · Bamboo Breakers · 4,280 points</p>',action('Back','close-modal'));break;
case 'trade-policy':showModal('Trading eligibility','<p>Trading depends on account eligibility and item restrictions. Both players must be eligible, and every item must be allowed before either offer can be locked.</p><p>If an offer changes, both confirmations reset. Review each item again before confirming.</p>',action('Understood','close-modal'));break;case 'change-offer':state.tradeStage=0;state.tradeChecked=false;state.tradeReadyAt=Date.now()+5000;render();clearInterval(tradeTimer);tradeTimer=setInterval(()=>{if(state.route==='trade')render();if(Date.now()>=state.tradeReadyAt)clearInterval(tradeTimer)},1000);toast('Offer changed. Both confirmations reset.');break;
case 'lock-trade':state.tradeStage=1;state.tradeReadyAt=Date.now()+5000;render();clearInterval(tradeTimer);tradeTimer=setInterval(()=>{if(state.route==='trade')render();if(Date.now()>=state.tradeReadyAt)clearInterval(tradeTimer)},1000);break;
case 'review-trade':showModal('Confirm this exact exchange?','<p><b>You give:</b> Reedguard Kangaroo · Lv. 14 · Standard · Normal</p><p><b>You receive:</b> Penguin Brawler · Lv. 8 · Standard · Normal</p><p>Any change to either offer requires a new confirmation.</p>',action('Back','close-modal','secondary')+action('Confirm exchange','complete-trade','positive'));break;
case 'complete-trade':closeModal();state.tradeStage=0;toast('Exchange complete. Item details saved to trade history.');break;case 'cancel-trade':state.tradeStage=0;state.tradeChecked=false;state.tradeReadyAt=0;goto('fighters');toast('Trade cancelled. Your items stay with you.');break;
case 'ranked-queue':state.mode='Ranked Duel';handle('queue');break;
case 'controls':showModal('Your controls',`<p>Input: ${state.input}</p><p>${state.input==='touch'?'Move: left thumbstick · Jump: dedicated button · Skills: three right-side buttons · Dash: shield button':state.input==='controller'?'Jump: A / Cross · Basic: X / Square · Tactical: Y / Triangle · Ultimate: RB / R1 · Dash: LB / L1':'Move: WASD · Jump: Space · Basic: Mouse1 · Tactical: E · Ultimate: R · Dash: Q'}</p><p>Tag-In appears only in Tag Team.</p>`,action('Done','close-modal'));break;
case 'tutorial':goto('onboarding');break;
case 'loading-state':showModal('Preparing the dojo','<p>Loading fighters and arena…</p><p>Your progress is saved. You can retry if loading does not finish.</p>',action('Back','close-modal','secondary')+action('Retry','loaded'));break;case 'loaded':closeModal();toast('Dojo ready.');break;
case 'connection-state':showModal('Connection interrupted','<p>We could not reach the match server. Your collection has not changed.</p><p>Check your connection, then try again.</p>',action('Back to dojo','lobby','secondary')+action('Retry','loaded'));break;
default:if(a.startsWith('sample-'))toast('Component selected.');else if(a.startsWith('buy-'))showModal('Review your purchase',`<p><b>${({'buy-99':'Confetti burst','buy-199':'Black hole','buy-249':'Meteor strike','buy-799':'Season 1 premium track'})[a]||'Cosmetic item'}</b></p><p>Price: ${a.split('-')[1]} Robux</p><p>The exact item and price will be confirmed in the Roblox purchase prompt. Combat stats are unchanged.</p>`,action('Cancel','close-modal','secondary')+action('Continue','purchase-pending'));else if(a==='purchase-pending'){showModal('Purchase pending','<p>Waiting for the purchase result. Your item will be granted after the receipt is confirmed.</p>',action('Back','close-modal','secondary')+action('Receipt confirmed','purchase-complete'))}else if(a==='purchase-complete'){closeModal();toast('Purchase confirmed. Item added to your collection.')}else if(a.startsWith('preview-')){showModal('Finisher preview',`<div class="shop-art">${icon(a.replace('preview-',''))}</div><p>This effect plays when you score a knockout. It does not change damage or knockback.</p>`,action('Done','close-modal'))}
}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.route){goto(b.dataset.route);return}if(b.dataset.review){review(b.dataset.review);return}if(b.dataset.action){handle(b.dataset.action);return}if(b.dataset.fighter){state.fighter=Number(b.dataset.fighter);render();toast(`${fighters[state.fighter].name} equipped.`);persist();return}if(b.dataset.filter){state.element=b.dataset.filter;render();return}if(b.dataset.variantSlot){state.variants[Number(b.dataset.variantSlot)]=Number(b.dataset.variantIndex);render();return}if(b.dataset.evolution){state.evolution=Number(b.dataset.evolution);render();return}if(b.dataset.mode){state.mode=b.dataset.mode;render();return}if(b.dataset.combatMode){state.mode=b.dataset.combatMode;render();return}});
root.addEventListener('input',e=>{if(e.target.id==='bd-search'){const p=e.target.selectionStart;state.search=e.target.value;render();let input=root.querySelector('#bd-search');input.focus();input.setSelectionRange(p,p)}});
root.addEventListener('change',e=>{if(e.target.id==='bd-input'){state.input=e.target.value;render();persist()}if(e.target.id==='bd-screen-picker')goto(e.target.value);if(e.target.id==='bd-trade-state'){state.tradePolicy=e.target.value==='restricted';state.tradeStage=0;state.tradeChecked=false;state.tradeReadyAt=0;clearInterval(tradeTimer);render()}if(e.target.id==='bd-scenario'){state.mode=e.target.value;render()}if(e.target.id==='bd-appearance'){state.appearance=e.target.value;designRender()}if(e.target.id==='bd-large'){state.large=e.target.checked;render()}if(e.target.id==='bd-high'){state.high=e.target.checked;render()}if(e.target.id==='bd-reduced'){state.reduced=e.target.checked;render()}if(e.target.id==='bd-trade-check'){state.tradeChecked=e.target.checked;render()}});
root.addEventListener('keydown',e=>{if(!modal.hidden){if(e.key==='Escape'){e.preventDefault();closeModal()}if(e.key==='Tab'){const focusables=[...modal.querySelectorAll('button:not(:disabled),input,select,a[href]')];const first=focusables[0],last=focusables.at(-1);if(e.shiftKey&&document.activeElement===first){e.preventDefault();last.focus()}else if(!e.shiftKey&&document.activeElement===last){e.preventDefault();first.focus()}}}});
function designRender(){root.style.setProperty('--bd-gold',state.accent);root.style.setProperty('--bd-radius',`${state.radius}px`);game.dataset.appearance=state.appearance}
render();designRender();
if(globalThis.Tweak){const t=new Tweak({container:game,onChange:designRender});t.addSelect(state,'appearance',{label:'Dojo appearance',options:[{label:'Follow system',value:'system'},{label:'Night dojo',value:'night'},{label:'Day dojo',value:'day'}]});t.addColorPicker(state,'accent',{label:'Primary action',reference:'--bd-gold'});t.addSlider(state,'radius',{label:'Panel corners',min:8,max:28,step:2,unit:'px',reference:'--bd-radius'})}
})();
</script>
