<style>
#kangaroo-proto{--kp-ink:#182b35;--kp-paper:#f7f0dc;--kp-border:#708d97;font-family:system-ui,sans-serif;color:light-dark(#182b35,#f7f0dc);width:100%}#kangaroo-proto *{box-sizing:border-box}#kangaroo-proto .kp-top{display:flex;align-items:baseline;justify-content:space-between;gap:12px;flex-wrap:wrap;margin-bottom:12px}#kangaroo-proto h2{font-size:22px;margin:0;font-weight:650}#kangaroo-proto .kp-label{font-size:12px;letter-spacing:.08em;text-transform:uppercase;color:light-dark(#4d6368,#b4c4c3)}#kangaroo-proto .kp-stage{height:510px;position:relative;border-radius:22px;overflow:hidden;background:linear-gradient(145deg,#e8e3d2,#b4c8bb);border:1px solid var(--kp-border)}#kangaroo-proto canvas{display:block;width:100%;height:100%;touch-action:pan-y}#kangaroo-proto .kp-caption{position:absolute;left:16px;top:16px;color:#182b35;background:#fff9e9;padding:8px 12px;border-radius:8px;font-size:12px;max-width:calc(100% - 120px)}#kangaroo-proto .kp-controls{display:flex;align-items:center;gap:10px;flex-wrap:wrap;margin-top:12px}#kangaroo-proto button{font:inherit;font-size:14px;min-height:44px;padding:10px 16px;border:1px solid var(--kp-border);border-radius:12px;background:light-dark(#fff9e9,#223b45);color:inherit}#kangaroo-proto button[aria-pressed=true]{background:#f4bd4f;color:#182b35;border-color:#d99c2d}#kangaroo-proto label{font-size:14px;display:flex;align-items:center;gap:10px;flex-wrap:wrap}#kangaroo-proto input{accent-color:#187d79;min-height:44px;max-width:100%}#kangaroo-proto .kp-foot{font-size:12px;color:light-dark(#4d6368,#b4c4c3);margin-top:10px;line-height:1.5}#kangaroo-proto .kp-error{position:absolute;inset:30%;color:#182b35;font-size:14px}#kangaroo-proto [hidden]{display:none!important}@media(max-width:480px){#kangaroo-proto .kp-stage{height:460px}#kangaroo-proto .kp-controls{gap:8px}#kangaroo-proto button{padding:10px 14px}#kangaroo-proto label{width:100%;justify-content:space-between}#kangaroo-proto .kp-caption{max-width:calc(100% - 32px)}}
</style>
<section id="kangaroo-proto" aria-label="Reedguard kangaroo prototype inspection">
 <div class="kp-top"><h2>Reedguard Kangaroo</h2><span class="kp-label">Original identity rig · v2</span></div>
 <div class="kp-stage" role="img" aria-label="Interactive three dimensional prototype: caramel kangaroo with tall ears, squared teal wraps, a reed forearm guard, oversized feet and a long tail."><div class="kp-caption">Shared geometry with the Roblox model</div><div class="kp-error">Loading 3D preview…</div></div>
 <div class="kp-controls" role="group" aria-label="Prototype pose"><button type="button" data-pose="guard" aria-pressed="true" class="cursor-interaction">Guard</button><button type="button" data-pose="jab" aria-pressed="false" class="cursor-interaction">Jab pose</button><button type="button" data-pose="hop" aria-pressed="false" class="cursor-interaction">Hop pose</button><label>View angle <input type="range" min="-180" max="180" value="30" step="1" aria-label="View angle"><output>30°</output></label></div>
 <div class="kp-foot" role="status" aria-live="polite">51 native Parts · 7 Motor6D joints · illustrative lighting · Studio testing pending</div>
</section>
<script type="module">
import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.js';
const spec=__KANGAROO_GEOMETRY__;
const root=document.getElementById('kangaroo-proto'),stage=root.querySelector('.kp-stage'),error=root.querySelector('.kp-error');
try{
 const scene=new THREE.Scene(),camera=new THREE.OrthographicCamera(-5,5,5,-5,.1,100);
 const renderer=new THREE.WebGLRenderer({antialias:true,alpha:true});renderer.setPixelRatio(Math.min(devicePixelRatio,2));renderer.shadowMap.enabled=true;renderer.shadowMap.type=THREE.PCFSoftShadowMap;renderer.setClearColor(0x000000,0);renderer.outputColorSpace=THREE.SRGBColorSpace;renderer.toneMapping=THREE.ACESFilmicToneMapping;renderer.toneMappingExposure=1.25;stage.prepend(renderer.domElement);renderer.domElement.setAttribute('aria-hidden','true');
 scene.add(new THREE.HemisphereLight(0xffffff,0x879984,2.5));const sun=new THREE.DirectionalLight(0xffedcc,3.2);sun.position.set(-5,10,-7);sun.castShadow=true;sun.shadow.mapSize.set(1024,1024);sun.shadow.camera.left=-6;sun.shadow.camera.right=6;sun.shadow.camera.top=8;sun.shadow.camera.bottom=-5;sun.shadow.normalBias=.03;scene.add(sun);const rim=new THREE.DirectionalLight(0xc4f3ed,1.2);rim.position.set(5,6,5);scene.add(rim);
 const floor=new THREE.Mesh(new THREE.CylinderGeometry(2.65,2.75,.14,64),new THREE.MeshStandardMaterial({color:0x466657,roughness:1}));floor.position.y=-.10;floor.receiveShadow=true;scene.add(floor);const ring=new THREE.Mesh(new THREE.TorusGeometry(2.40,.025,8,80),new THREE.MeshStandardMaterial({color:0xdcb65b,roughness:.9}));ring.rotation.x=Math.PI/2;ring.position.y=-.018;scene.add(ring);
 const nodes={},materials={};for(const g of spec.groups){const node=new THREE.Group();node.position.fromArray(g.pivot);(g.parent?nodes[g.parent]:scene).add(node);nodes[g.name]=node;}
 const sphere=new THREE.SphereGeometry(.5,24,16),box=new THREE.BoxGeometry(1,1,1);
 for(const p of spec.parts){if(!materials[p.color])materials[p.color]=new THREE.MeshStandardMaterial({color:p.color,roughness:.78,metalness:0});const mesh=new THREE.Mesh(p.shape==='Ball'?sphere:box,materials[p.color]);mesh.name=p.name;mesh.scale.fromArray(p.size);mesh.position.fromArray(p.position);mesh.rotation.set(...p.rotation);mesh.castShadow=true;mesh.receiveShadow=true;nodes[p.group].add(mesh);}
 let angle=30,pose='guard';const saved=globalThis.openai?.widgetState?.modelContent;if(saved&&['guard','jab','hop'].includes(saved.pose)){pose=saved.pose;angle=Number(saved.angle)||30;}
 const render=()=>renderer.render(scene,camera);
 function view(){const width=stage.clientWidth,height=stage.clientHeight,aspect=width/height,h=Math.max(7.55,5.05/aspect);renderer.setSize(width,height);camera.left=-h*aspect/2;camera.right=h*aspect/2;camera.top=h/2;camera.bottom=-h/2;const a=angle*Math.PI/180;camera.position.set(13*Math.sin(a),6.1,-13*Math.cos(a));camera.lookAt(0,3.0,.1);camera.updateProjectionMatrix();render();}
 function poseModel(){for(const g of spec.groups){nodes[g.name].position.fromArray(g.pivot);nodes[g.name].rotation.set(0,0,0);}if(pose==='jab'){nodes['Right Arm'].position.z=-.65;nodes['Right Arm'].rotation.set(-.12,-.20,-.10);nodes.Torso.rotation.y=-.12;nodes.Head.rotation.y=.12;}if(pose==='hop'){nodes.Torso.position.y+=.80;nodes['Right Leg'].rotation.x=-.30;nodes['Left Leg'].rotation.x=.45;nodes.Tail.rotation.x=-.15;nodes['Left Arm'].rotation.z=-.18;nodes['Right Arm'].rotation.z=.18;}root.querySelectorAll('[data-pose]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.pose===pose)));root.querySelector('input').value=angle;root.querySelector('output').textContent=angle+'°';view();}
 function persist(){globalThis.openai?.setWidgetState?.({modelContent:{fighter:'Reedguard Kangaroo',pose,angle},privateContent:null}).catch(()=>{});}
 root.querySelectorAll('[data-pose]').forEach(b=>b.addEventListener('click',()=>{pose=b.dataset.pose;poseModel();persist();}));root.querySelector('input').addEventListener('input',e=>{angle=Number(e.target.value);root.querySelector('output').textContent=angle+'°';view();});root.querySelector('input').addEventListener('change',persist);new ResizeObserver(view).observe(stage);window.addEventListener('openai:set_globals',e=>{const s=e.detail?.globals?.widgetState?.modelContent;if(s&&['guard','jab','hop'].includes(s.pose)){pose=s.pose;angle=Number(s.angle)||30;poseModel();}});error.hidden=true;poseModel();
}catch(e){error.textContent='3D preview could not initialize on this device. The Roblox prototype files remain available.';console.error(e);}
</script>
