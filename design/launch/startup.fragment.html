function loading(){return `<div class="loader"><span class="wordmark">BEAST DOJO</span><h2>Opening your dojo</h2><div class="load-track" role="progressbar" aria-label="Loading preview" aria-valuemin="0" aria-valuemax="100" aria-valuenow="72"><span></span></div><div class="load-status">${state.profile==='returning'?'Restoring your saved progress…':'Preparing your first visit…'}<small>Tip: your progress follows your Roblox account.</small></div><div class="load-actions">${btn('Continue preview','loaded')}${btn('Retry state','load-failure','quiet')}</div></div>`;}
function welcome(){return `<div class="panel welcome-panel"><span class="kicker">Your first dojo partner</span><h2>Meet Reedguard.</h2><span class="animal-label">LAND · AGILE · LEVEL 1</span><p>A quick-footed keeper of the training court. Reedguard is yours to start with.</p><div class="row">${btn(`${key(confirmKey())}Start training`,'start-training')}${btn('Explore first','skip-training','quiet')}</div><div class="detail-line">Learn the basics in a short guided practice.</div></div>`;}
function practice(){const tasks=[['Get moving','Move toward the lantern.'],['Find your feet','Jump over the low training rail.'],['A little burst','Dash through the glowing marker.'],['Ready for the dojo','You have learned move, jump and dash.']];const t=tasks[state.practice];const touch=state.platform==='touch';return `<div class="practice-hud"><div class="step-dots">${[0,1,2].map(i=>`<i class="${state.practice>i?'done':''}"></i>`).join('')}</div><h3>${t[0]}</h3><p>${t[1]}</p></div><div class="practice-controls">${touch?`<button type="button" class="joystick cursor-interaction" data-action="move" aria-label="Move toward the lantern"><span>Move</span></button>`:`<div class="controller-help"><b>Left stick</b> · Move<br>${btn('Move forward','move','quiet')}<br>${key(confirmKey())} Jump · ${key(state.platform==='xbox'?'LB':'L1')} Dash</div>`}<div class="skills"><button type="button" class="skill ${state.practice===1?'highlight':''} cursor-interaction" data-action="jump">${key(confirmKey())}Jump</button><button type="button" class="skill ${state.practice===2?'highlight':''} cursor-interaction" data-action="dash">${key(state.platform==='xbox'?'LB':'L1')}Dash</button></div></div><div class="practice-bottom">${state.practice===3?btn(`${key(confirmKey())}Finish training`,'finish-training','jade'):btn(touch?'Skip training':'Skip training preview','skip-training','quiet')}</div>`;}
function reward(){return `<div class="panel transition-card"><span class="kicker">Training complete</span><h2>Your journey starts here.</h2><div class="reward-number">+120 Coins</div><p>+100 Animal XP · Reedguard Kangaroo</p><div class="modal-status" role="status">${state.saveState==='saved'?'Progress saved. Ready for your next visit.':state.saveState==='failed'?'Saving is unavailable. Your reward is still pending. Retry before leaving.':state.saveState==='saving'?'Saving your reward…':'Reward ready. Confirm to save your progress.'}</div>${state.saveState==='saved'?btn(`${key(confirmKey())}Go to the dojo`,'go-dojo','jade'):btn(state.saveState==='failed'?'Retry save':'Save reward','save-reward','',state.saveState==='saving')}${btn('Save failure preview','save-failure','quiet')}</div>`;}
function dojo(){const p=profile();return `<div class="hud-top"><span class="wordmark">BEAST DOJO</span><div class="balances"><span class="balance"><b>${p.coins.toLocaleString()}</b> Coins</span><span class="balance">Lv. ${p.level} Reedguard</span></div></div><div class="lobby-content"><span class="kicker">${state.profile==='returning'?'Welcome back':'Welcome to your dojo'}</span><h2>Ready for your<br>next challenge?</h2><div class="quest">Your next goal<small>${state.profile==='returning'?state.trackedQuest:state.trackedQuest}</small></div>${btn(`${key(confirmKey())}Explore`,'world')}${btn('Enter the arena','modes','secondary')}</div><nav class="game-nav" aria-label="Dojo navigation"><button data-action="world" type="button">World</button><button data-action="modes" type="button">Arena</button><button data-action="trophies" type="button">Trophies</button><button data-action="animals" type="button">Animals</button><button data-action="party" type="button">Party</button><button data-action="settings" type="button">Settings</button></nav>`;}
function match(){return `<div class="fight-top"><div class="combatant"><b>Reedguard</b><span>YOU · Lv. ${profile().level}</span><meter min="0" max="100" value="${state.hp}" aria-label="Your health">${state.hp}</meter><small>${state.hp} / 100 HP</small></div><div class="round-clock">PRACTICE<small>ROUND 1</small></div><div class="combatant rival"><b>Training Bot</b><span>GUIDED OPPONENT</span><meter min="0" max="100" value="${state.enemyHP}" aria-label="Opponent health">${state.enemyHP}</meter><small>${state.enemyHP} / 100 HP</small></div></div><div class="combat-cue" role="status">${state.turn===0?'Try a Palm Strike. Watch for the bot’s next move.':state.turn%2?'The bot is winding up. Dodge or parry to stay safe.':'Clear opening! Try another strike.'}</div><div class="practice-controls">${state.platform==='touch'?'<button class="joystick cursor-interaction" data-action="fight-dodge" aria-label="Move out of the attack"><span>Move</span></button>':'<div class="controller-help">Left stick · Move<br>Directional buttons · Select</div>'}<div class="fight-actions">${btn(key(state.platform==='playstation'?'Square':'X')+'Palm Strike','fight-hit')}${btn(key(state.platform==='playstation'?'Circle':'B')+'Dodge','fight-dodge','secondary')}${btn(key(state.platform==='playstation'?'Triangle':'Y')+'Parry','fight-parry','secondary')}</div></div><div class="practice-bottom">${btn('Leave practice','leave-match','quiet')}</div>`;}
function results(){return `<div class="panel transition-card"><span class="kicker">Practice match complete</span><h2>A strong first round.</h2><p>Reedguard Kangaroo · ${state.hp} HP remaining</p><div class="reward-number">+80 Coins</div><p>+60 Animal XP</p><div class="modal-status" role="status">${state.saveState==='saved'?'Match reward saved.':state.saveState==='saving'?'Saving match reward…':state.saveState==='failed'?'Save unavailable. Reward pending; retry safely.':'Match reward pending confirmation.'}</div>${state.saveState==='saved'?btn('Return to dojo','go-dojo','jade'):btn(state.saveState==='failed'?'Retry save':'Save match reward','save-reward','',state.saveState==='saving')}${btn('Rematch','new-match','secondary')}${btn('Save failure preview','save-failure','quiet')}</div>`;}
function persist(){globalThis.openai?.setWidgetState?.({modelContent:{previewDevice:state.platform,playerType:state.profile,screen:state.stage},privateContent:{reduceMotion:state.reduce}}).catch(()=>{});}
function go(stage){state.stage=stage;state.modal='';modal.hidden=true;modal.innerHTML='';render();persist();}
function render(){game.dataset.platform=state.platform;game.dataset.stage=state.stage;root.querySelector('#bdl-platform').value=state.platform;root.querySelector('#bdl-profile').value=state.profile;root.querySelector('#bdl-screen').innerHTML=steps.map(([id,name])=>`<option value="${id}" ${id===state.stage?'selected':''}>${name}</option>`).join('');root.querySelector('#bdl-journey').innerHTML=steps.map(([id,name,cue])=>`<li><button type="button" class="cursor-interaction" data-stage="${id}" ${id===state.stage?'aria-current="step"':''}><b>${name}</b><div class="mini-screen" aria-hidden="true"></div><span>${cue}</span></button></li>`).join('');ui.innerHTML=({title,loading,welcome,practice,reward,dojo,match,results}[state.stage]||title)();root.querySelector('#bdl-note').textContent=notes[state.stage];sceneUpdate();}
function show(heading,body,actions){trigger=document.activeElement;state.modal=heading;modal.innerHTML=`<div class="panel" role="dialog" aria-modal="true" aria-label="${heading}"><h2>${heading}</h2>${body}<div class="row">${actions||btn('Done','close-modal','jade')}</div></div>`;modal.hidden=false;modal.querySelector('button')?.focus();}
function close(){state.modal='';modal.hidden=true;modal.innerHTML='';if(trigger?.isConnected)trigger.focus();}
function handle(action){switch(action){case'enter':go(state.profile==='returning'?'dojo':'welcome');break;case'loaded':go('title');break;case'start-training':state.practice=0;go('practice');break;case'move':if(state.stage==='practice'&&state.practice===0){state.practice=1;render();}break;case'jump':if(state.practice===1){state.practice=2;render();}break;case'dash':if(state.practice===2){state.practice=3;render();}break;case'finish-training':state.saveState='idle';go('reward');break;case'skip-training':go('dojo');break;case'go-dojo':go('dojo');break;case'save-reward':state.saveState='saving';render();clearTimeout(saveTimer);saveTimer=setTimeout(()=>{if(state.stage==='reward'&&!state.trainingClaimed){state.coins+=120;state.trainingClaimed=true;}if(state.stage==='results'&&state.savedMatch!==state.matchId){state.coins+=80;state.savedMatch=state.matchId;}state.saveState='saved';if(['reward','results'].includes(state.stage))render();},650);break;case'save-failure':clearTimeout(saveTimer);state.saveState='failed';render();break;case'load-failure':show('Your dojo is still safe','<p>We could not load your progress. We will retry before opening the dojo.</p><p>Saved account data will not be replaced with a new profile.</p>',btn('Retry loading','retry-load')+btn('Back','close-modal','quiet'));break;case'retry-load':close();go('loading');break;case'settings':show('Make yourself comfortable',`<label class="settings-row">Sound preference<input type="checkbox" data-setting="sound" ${state.sound?'checked':''}></label><label class="settings-row">Reduced motion<input type="checkbox" data-setting="reduce" ${state.reduce?'checked':''}></label><label class="settings-row">High-contrast labels<input type="checkbox" data-setting="high" ${state.high?'checked':''}></label><p>Controls adapt to the preview device. Audio is not included in this study.</p>`);break;case'animals':show('Your animal',`<span class="animal-label">LAND · AGILE</span><h3>Reedguard Kangaroo</h3><p>Level ${profile().leve e')+btn('Done','close-modal','quiet'));break;}case'track-mentor':close();render();break;case'modes':show('Choose your match','<p>Start with guided practice, then discover the full dojo.</p><div class="mode-grid"><button class="mode-tile cursor-interaction" data-action="new-match"><b>Guided duel</b><small>Learn the fight · Training opponent</small></button><button class="mode-tile cursor-interaction" data-action="future-mode"><b>Dojo Brawl</b><small>8 players · Free for all</small></button><button class="mode-tile cursor-interaction" data-action="future-mode"><b>Tag Team</b><small>Swap with your backup animal</small></button><button class="mode-tile cursor-interaction" data-action="future-mode"><b>Co-op Raid</b><small>4 players · Original dojo bosses</small></button></div><p>Design study: guided duel is the interactive sample.</p>');break;case'future-mode':show('More dojo challenges','<p>This mode belongs to the production roadmap. Explore the guided duel to review the current combat interface.</p>',btn('Try guided duel','new-match'));break;case'new-match':state.matchId++;state.enemyHP=100;state.hp=100;state.turn=0;go('match');break;case'fight-hit':if(state.stage==='match'){state.enemyHP=Math.max(0,state.enemyHP-25);state.hp=Math.max(20,state.hp-(state.turn%2?10:0));state.turn++;if(!state.enemyHP){state.saveState='idle';go('results');}else render();}break;case'fight-dodge':case'fight-parry':if(state.stage==='match'){state.turn=state.turn%2?state.turn+1:state.turn;render();}break;case'leave-match':show('Leave this practice?','<p>No match reward has been earned yet.</p>',btn('Return to dojo','go-dojo')+btn('Keep training','close-modal','secondary'));break;case'close-modal':close();break;}}
root.addEventListener('click',e=>{const b=e.target.closest('button');if(!b||b.disabled)return;if(b.dataset.district){const d=worldDistricts.find(x=>x.id===b.dataset.district);state.trackedQuest=d.chapter;show(d.name,'<p>'+d.chapter+'</p><p>Arena destination: '+d.arena+'</p><p>Follow mentor stories, explore activities and find permanent seals.</p>',btn('Track mentor quest','track-mentor','jade')+btn('Back to world','world','secondary'));return;}if(b.dataset.stage){go(b.dataset.stage);return;}if(b.dataset.action)handle(b.dataset.action);});
